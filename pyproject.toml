[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lastro"
version = "0.1.0"
description = "Organização para a era da IA — do state.db ao Obsidian"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Emanuel Filipe", email = "contato.emanuel2002@gmail.com"},
]
keywords = ["hermes-agent", "obsidian", "automation", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/EmanuelXBT/Lastro"
Repository = "https://github.com/EmanuelXBT/Lastro.git"
Issues = "https://github.com/EmanuelXBT/Lastro/issues"

[tool.setuptools]
py-modules = ["__init__", "__main__", "cli", "engine", "schemas", "tz", "vault"]
packages = ["collectors"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "BLE001",    # blind except is intentional in CLI/data pipeline
    "UP045",     # X | None requires Python 3.10+, project targets 3.9+
    "N999",      # CI checkout dir name (Lastro) vs package name (lastro)
]
